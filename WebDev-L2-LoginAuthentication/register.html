<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Register | Shreya Adhate</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link
        href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Playfair+Display:wght@600;700&display=swap"
        rel="stylesheet"
    >

    <link rel="stylesheet" href="style.css">

</head>

<body class="auth-body">

    <main class="auth-wrapper">

        <section class="auth-card">

            <div class="brand">
                Secure<span>Space</span>
            </div>

            <p class="auth-label">
                CREATE ACCOUNT
            </p>

            <h1>
                Join SecureSpace
            </h1>

            <p class="auth-description">
                Create an account to access your personal dashboard.
            </p>


            <form
                id="registerForm"
                class="auth-form"
            >

                <div class="form-group">

                    <label for="registerUsername">
                        Username
                    </label>

                    <input
                        type="text"
                        id="registerUsername"
                        placeholder="Choose a username"
                        autocomplete="username"
                    >

                </div>


                <div class="form-group">

                    <label for="registerEmail">
                        Email
                    </label>

                    <input
                        type="email"
                        id="registerEmail"
                        placeholder="Enter your email"
                        autocomplete="email"
                    >

                </div>


                <div class="form-group">

                    <label for="registerPassword">
                        Password
                    </label>

                    <input
                        type="password"
                        id="registerPassword"
                        placeholder="Minimum 8 characters + 1 number"
                        autocomplete="new-password"
                    >

                </div>


                <p
                    id="registerError"
                    class="form-error"
                ></p>


                <p
                    id="registerSuccess"
                    class="form-success"
                ></p>


                <button
                    type="submit"
                    class="primary-btn"
                >
                    Register
                </button>

            </form>


            <p class="switch-text">

                Already have an account?

                <a href="index.html">
                    Login
                </a>

            </p>

        </section>

    </main>


    <script src="script.js"></script>

</body>

</html>
